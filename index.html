<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ───────────────────────────────────────────────────────────────────────────
// SUPABASE CONFIG (optional)
// Fill these in to enable background sync. Leave blank to run localStorage-only.
// Schema expected: table `kv_store` with columns `key` (text, pk) and `value` (jsonb or text).
// RLS must allow anon select/insert/update/delete on kv_store (or use a service key in a backend).
// ───────────────────────────────────────────────────────────────────────────
const SUPABASE_URL = ""; // e.g. "https://xxxx.supabase.co"
const SUPABASE_ANON_KEY = ""; // e.g. "eyJhbGciOi..."
const SUPABASE_ENABLED = !!(SUPABASE_URL && SUPABASE_ANON_KEY);

// ───────────────────────────────────────────────────────────────────────────
// Persistence layer
// ───────────────────────────────────────────────────────────────────────────
const LS = {
  CONFIG: 'archive:config',
  ITEM_IDS: 'archive:item-ids',
  ITEM: (id) => `archive:item:${id}`,
  DELETED_SEEDS: 'archive:deleted-seed-ids',
};

function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null || raw === undefined) return fallback;
    return JSON.parse(raw);
  } catch {
    return fallback;
  }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}
function lsDel(key) {
  try { localStorage.removeItem(key); } catch {}
}

// Supabase REST helpers — fire and forget for writes, awaited for initial read.
async function sbGet(key) {
  if (!SUPABASE_ENABLED) return null;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });
    if (!r.ok) return null;
    const rows = await r.json();
    if (!rows || !rows.length) return null;
    const v = rows[0].value;
    if (typeof v === 'string') {
      try { return JSON.parse(v); } catch { return v; }
    }
    return v;
  } catch {
    return null;
  }
}
async function sbGetAllItems() {
  if (!SUPABASE_ENABLED) return [];
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=like.archive:item:*&select=key,value`, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });
    if (!r.ok) return [];
    const rows = await r.json();
    return (rows || []).map((row) => {
      const v = row.value;
      if (typeof v === 'string') { try { return JSON.parse(v); } catch { return null; } }
      return v;
    }).filter(Boolean);
  } catch {
    return [];
  }
}
function sbUpsert(key, value) {
  if (!SUPABASE_ENABLED) return;
  fetch(`${SUPABASE_URL}/rest/v1/kv_store`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates',
    },
    body: JSON.stringify({ key, value }),
  }).catch(() => {});
}
function sbDelete(key) {
  if (!SUPABASE_ENABLED) return;
  fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}`, {
    method: 'DELETE',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
  }).catch(() => {});
}

// ───────────────────────────────────────────────────────────────────────────
// Defaults + seeds
// ───────────────────────────────────────────────────────────────────────────
const DEFAULT_CONFIG = {
  pageTitle: 'Archive',
  tabs: [], // [{ id, name }]
};

const SEEDS = [
  {
    id: 'seed-reading-list',
    type: 'table',
    title: 'Reading list',
    description: 'Articles and books worth returning to.',
    tabId: 'all',
    createdAt: 0,
    isSeed: true,
    data: {
      columns: [
        { id: 'c1', label: 'Title' },
        { id: 'c2', label: 'Author' },
        { id: 'c3', label: 'Status' },
        { id: 'c4', label: 'Notes' },
      ],
      rows: [
        ['The Tyranny of Metrics', 'Jerry Z. Muller', 'Reading', 'On measurement and its discontents.'],
        ['Designing Data-Intensive Applications', 'Martin Kleppmann', 'Queued', ''],
        ['On Writing Well', 'William Zinsser', 'Done', 'Clarity over cleverness.'],
      ],
    },
  },
  {
    id: 'seed-team-notes',
    type: 'table',
    title: 'Team rituals',
    description: 'Recurring practices and what they are for.',
    tabId: 'all',
    createdAt: 0,
    isSeed: true,
    data: {
      columns: [
        { id: 'c1', label: 'Ritual' },
        { id: 'c2', label: 'Cadence' },
        { id: 'c3', label: 'Purpose' },
      ],
      rows: [
        ['Weekly review', 'Friday', 'Reflect and reset priorities.'],
        ['Async standup', 'Daily', 'Surface blockers without a meeting.'],
        ['Show & tell', 'Bi-weekly', 'Share works in progress.'],
      ],
    },
  },
];

function uid(prefix = 'id') {
  return `${prefix}-${Math.random().toString(36).slice(2, 9)}${Date.now().toString(36).slice(-4)}`;
}

// ───────────────────────────────────────────────────────────────────────────
// Archive state hook
// ───────────────────────────────────────────────────────────────────────────
function useArchive() {
  const [config, setConfigState] = useState(() => lsGet(LS.CONFIG, DEFAULT_CONFIG));
  const [items, setItems] = useState(() => {
    const ids = lsGet(LS.ITEM_IDS, null);
    if (ids && Array.isArray(ids)) {
      const loaded = ids.map((id) => lsGet(LS.ITEM(id), null)).filter(Boolean);
      // Inject seeds that haven't been deleted, on first run when no items exist
      const deletedSeeds = lsGet(LS.DELETED_SEEDS, []);
      if (loaded.length === 0) {
        const fresh = SEEDS.filter((s) => !deletedSeeds.includes(s.id));
        return fresh;
      }
      return loaded;
    } else {
      const deletedSeeds = lsGet(LS.DELETED_SEEDS, []);
      return SEEDS.filter((s) => !deletedSeeds.includes(s.id));
    }
  });

  // On first mount, ensure seeds are written if not yet stored.
  const seededRef = useRef(false);
  useEffect(() => {
    if (seededRef.current) return;
    seededRef.current = true;
    const existingIds = lsGet(LS.ITEM_IDS, null);
    if (!existingIds) {
      // first-ever load: write seeds to LS + Supabase
      const deleted = lsGet(LS.DELETED_SEEDS, []);
      const fresh = SEEDS.filter((s) => !deleted.includes(s.id));
      const ids = fresh.map((s) => s.id);
      lsSet(LS.ITEM_IDS, ids);
      lsSet(LS.CONFIG, config);
      fresh.forEach((item) => {
        lsSet(LS.ITEM(item.id), item);
        sbUpsert(LS.ITEM(item.id), item);
      });
      sbUpsert(LS.ITEM_IDS, ids);
      sbUpsert(LS.CONFIG, config);
    }
    // Background sync: pull config + items from Supabase and merge. Local wins.
    (async () => {
      if (!SUPABASE_ENABLED) return;
      const remoteConfig = await sbGet(LS.CONFIG);
      if (remoteConfig && !lsGet(LS.CONFIG, null)) {
        lsSet(LS.CONFIG, remoteConfig);
        setConfigState(remoteConfig);
      }
      const remoteItems = await sbGetAllItems();
      if (remoteItems.length) {
        const localIds = new Set((lsGet(LS.ITEM_IDS, []) || []).map(String));
        const deletedSeeds = lsGet(LS.DELETED_SEEDS, []);
        const additions = remoteItems.filter(
          (it) => it && it.id && !localIds.has(it.id) && !deletedSeeds.includes(it.id)
        );
        if (additions.length) {
          additions.forEach((it) => lsSet(LS.ITEM(it.id), it));
          const newIds = [...(lsGet(LS.ITEM_IDS, []) || []), ...additions.map((it) => it.id)];
          lsSet(LS.ITEM_IDS, newIds);
          setItems((prev) => [...prev, ...additions]);
        }
      }
    })();
  // eslint-disable-next-line
  }, []);

  const persistItems = (next) => {
    setItems(next);
    const ids = next.map((i) => i.id);
    lsSet(LS.ITEM_IDS, ids);
    sbUpsert(LS.ITEM_IDS, ids);
  };

  const setConfig = (next) => {
    setConfigState(next);
    lsSet(LS.CONFIG, next);
    sbUpsert(LS.CONFIG, next);
  };

  const upsertItem = (item) => {
    setItems((prev) => {
      const idx = prev.findIndex((p) => p.id === item.id);
      let next;
      if (idx === -1) next = [...prev, item];
      else { next = [...prev]; next[idx] = item; }
      const ids = next.map((i) => i.id);
      lsSet(LS.ITEM_IDS, ids);
      lsSet(LS.ITEM(item.id), item);
      sbUpsert(LS.ITEM_IDS, ids);
      sbUpsert(LS.ITEM(item.id), item);
      return next;
    });
  };

  const deleteItem = (id) => {
    setItems((prev) => {
      const target = prev.find((p) => p.id === id);
      const next = prev.filter((p) => p.id !== id);
      const ids = next.map((i) => i.id);
      lsSet(LS.ITEM_IDS, ids);
      lsDel(LS.ITEM(id));
      sbUpsert(LS.ITEM_IDS, ids);
      sbDelete(LS.ITEM(id));
      if (target && target.isSeed) {
        const deleted = lsGet(LS.DELETED_SEEDS, []);
        if (!deleted.includes(id)) {
          const nextDeleted = [...deleted, id];
          lsSet(LS.DELETED_SEEDS, nextDeleted);
          sbUpsert(LS.DELETED_SEEDS, nextDeleted);
        }
      }
      return next;
    });
  };

  const addTab = (name) => {
    const tab = { id: uid('tab'), name };
    setConfig({ ...config, tabs: [...config.tabs, tab] });
    return tab;
  };
  const deleteTab = (tabId) => {
    // Reassign items in that tab to "all"
    const affected = items.filter((i) => i.tabId === tabId);
    affected.forEach((it) => upsertItem({ ...it, tabId: 'all' }));
    setConfig({ ...config, tabs: config.tabs.filter((t) => t.id !== tabId) });
  };

  return {
    config, setConfig,
    items, setItems: persistItems,
    upsertItem, deleteItem,
    addTab, deleteTab,
  };
}

// ───────────────────────────────────────────────────────────────────────────
// Small UI helpers
// ───────────────────────────────────────────────────────────────────────────
function StarIcon({ filled = false, className = '' }) {
  return (
    <svg viewBox="0 0 24 24" className={className} fill={filled ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
    </svg>
  );
}
function IconButton({ onClick, title, children, className = '' }) {
  return (
    <button onClick={onClick} title={title}
      className={`inline-flex items-center justify-center rounded-md p-1.5 text-muted hover:text-ink hover:bg-line/60 transition-colors ${className}`}>
      {children}
    </button>
  );
}
function PrimaryButton({ onClick, children, className = '' }) {
  return (
    <button onClick={onClick}
      className={`inline-flex items-center gap-2 rounded-md bg-ember text-parchment px-3 py-2 text-sm font-medium hover:bg-ember/90 transition-colors ${className}`}>
      {children}
    </button>
  );
}
function GhostButton({ onClick, children, className = '' }) {
  return (
    <button onClick={onClick}
      className={`inline-flex items-center gap-2 rounded-md border border-line bg-parchment px-3 py-2 text-sm font-medium text-ink hover:border-muted/50 transition-colors ${className}`}>
      {children}
    </button>
  );
}

function formatBytes(n) {
  if (!n && n !== 0) return '';
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${(n / (1024 * 1024)).toFixed(2)} MB`;
}

// ───────────────────────────────────────────────────────────────────────────
// Long-press hook
// ───────────────────────────────────────────────────────────────────────────
function useLongPress(onLongPress, ms = 800) {
  const timer = useRef(null);
  const triggered = useRef(false);
  const start = (e) => {
    if (e && e.cancelable) e.preventDefault();
    triggered.current = false;
    clear();
    timer.current = setTimeout(() => {
      triggered.current = true;
      onLongPress();
    }, ms);
  };
  const clear = () => {
    if (timer.current) {
      clearTimeout(timer.current);
      timer.current = null;
    }
  };
  return {
    onPointerDown: start,
    onPointerUp: clear,
    onPointerLeave: clear,
    onPointerCancel: clear,
  };
}

// ───────────────────────────────────────────────────────────────────────────
// Header
// ───────────────────────────────────────────────────────────────────────────
function Header({ title, onOpenAdmin }) {
  const longPress = useLongPress(onOpenAdmin, 800);
  return (
    <header className="border-b border-line">
      <div className="max-w-3xl mx-auto px-6 py-6 flex items-center justify-between">
        <h1 className="font-display text-3xl sm:text-4xl tracking-tight text-ink">{title}</h1>
        <button
          {...longPress}
          className="text-muted hover:text-ember transition-colors select-none touch-none"
          title=""
          aria-label="archive star"
        >
          <StarIcon className="w-5 h-5" />
        </button>
      </div>
    </header>
  );
}

// ───────────────────────────────────────────────────────────────────────────
// Tab bar
// ───────────────────────────────────────────────────────────────────────────
function TabBar({ tabs, current, onChange, counts }) {
  if (!tabs || tabs.length < 1) return null;
  const all = { id: 'all', name: 'All' };
  const list = [all, ...tabs];
  return (
    <div className="max-w-3xl mx-auto px-6 mt-4">
      <div className="flex flex-wrap gap-1 border-b border-line">
        {list.map((t) => {
          const active = current === t.id;
          return (
            <button key={t.id} onClick={() => onChange(t.id)}
              className={`px-3 py-2 text-sm font-medium relative transition-colors ${active ? 'text-ember' : 'text-muted hover:text-ink'}`}>
              {t.name}
              <span className="font-mono text-[10px] ml-1.5 text-muted/80">{counts[t.id] || 0}</span>
              {active && <span className="absolute left-2 right-2 -bottom-px h-[2px] bg-ember rounded-full" />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ───────────────────────────────────────────────────────────────────────────
// Item list
// ───────────────────────────────────────────────────────────────────────────
function ItemList({ items, onOpen }) {
  if (!items.length) {
    return (
      <div className="max-w-3xl mx-auto px-6 py-16 text-center">
        <p className="font-display text-2xl text-ink mb-2">Nothing here yet</p>
        <p className="text-muted text-sm">Long-press the star above to open the admin portal and add your first item.</p>
      </div>
    );
  }
  return (
    <div className="max-w-3xl mx-auto px-6 py-6">
      <ul className="divide-y divide-line">
        {items.map((item) => {
          const hint = item.type === 'html'
            ? formatBytes(item.data?.size)
            : `${(item.data?.rows?.length || 0)} rows · ${(item.data?.columns?.length || 0)} cols`;
          return (
            <li key={item.id}>
              <button onClick={() => onOpen(item)}
                className="group w-full text-left py-5 flex items-start justify-between gap-6 hover:bg-line/30 -mx-3 px-3 rounded-md transition-colors">
                <div className="min-w-0">
                  <div className="flex items-baseline gap-3">
                    <h3 className="font-display text-xl text-ink truncate">{item.title || 'Untitled'}</h3>
                    <span className="font-mono text-[10px] uppercase tracking-wider text-muted/80">{item.type}</span>
                  </div>
                  {item.description && (
                    <p className="text-muted text-sm mt-1 line-clamp-2">{item.description}</p>
                  )}
                </div>
                <div className="shrink-0 font-mono text-xs text-muted whitespace-nowrap pt-1.5">{hint}</div>
              </button>
            </li>
          );
        })}
      </ul>
    </div>
  );
}

// ───────────────────────────────────────────────────────────────────────────
// HTML viewer
// ───────────────────────────────────────────────────────────────────────────
function HtmlViewer({ item, onBack }) {
  return (
    <div className="fixed inset-0 bg-parchment flex flex-col z-40">
      <div className="border-b border-line px-4 py-3 flex items-center gap-3 bg-parchment">
        <GhostButton onClick={onBack}>← Back</GhostButton>
        <div className="min-w-0">
          <div className="font-display text-lg truncate">{item.title}</div>
          {item.description && <div className="text-muted text-xs truncate">{item.description}</div>}
        </div>
      </div>
      <iframe
        title={item.title}
        srcDoc={item.data?.content || '<p style="font-family: sans-serif; padding: 2rem; color:#777">No content.</p>'}
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
        className="flex-1 w-full bg-white"
      />
    </div>
  );
}

// ───────────────────────────────────────────────────────────────────────────
// Table editor
// ───────────────────────────────────────────────────────────────────────────
function TableEditor({ item, onBack, onSave }) {
  const [data, setData] = useState(item.data || { columns: [], rows: [] });
  const [editing, setEditing] = useState(null); // { type: 'cell'|'header', r?, c }
  const [draft, setDraft] = useState('');
  const taRef = useRef(null);

  // Auto-save on every data change
  useEffect(() => {
    onSave({ ...item, data });
  // eslint-disable-next-line
  }, [data]);

  useEffect(() => {
    if (editing && taRef.current) {
      taRef.current.focus();
      taRef.current.select();
    }
  }, [editing]);

  const startCellEdit = (r, c) => {
    setEditing({ type: 'cell', r, c });
    setDraft(data.rows[r]?.[c] ?? '');
  };
  const startHeaderEdit = (c) => {
    setEditing({ type: 'header', c });
    setDraft(data.columns[c]?.label ?? '');
  };
  const commit = () => {
    if (!editing) return;
    if (editing.type === 'cell') {
      const nextRows = data.rows.map((row, ri) => {
        if (ri !== editing.r) return row;
        const copy = [...row];
        copy[editing.c] = draft;
        return copy;
      });
      setData({ ...data, rows: nextRows });
    } else {
      const nextCols = data.columns.map((col, ci) => ci === editing.c ? { ...col, label: draft } : col);
      setData({ ...data, columns: nextCols });
    }
    setEditing(null);
  };
  const cancel = () => setEditing(null);

  const addColumn = () => {
    const newCol = { id: uid('c'), label: `Column ${data.columns.length + 1}` };
    const newRows = data.rows.map((row) => [...row, '']);
    setData({ columns: [...data.columns, newCol], rows: newRows });
  };
  const addRow = () => {
    const newRow = data.columns.map(() => '');
    setData({ ...data, rows: [...data.rows, newRow] });
  };
  const deleteColumn = (c) => {
    const newCols = data.columns.filter((_, i) => i !== c);
    const newRows = data.rows.map((row) => row.filter((_, i) => i !== c));
    setData({ columns: newCols, rows: newRows });
  };
  const deleteRow = (r) => {
    setData({ ...data, rows: data.rows.filter((_, i) => i !== r) });
  };

  const handleKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { e.preventDefault(); cancel(); }
  };

  return (
    <div className="fixed inset-0 bg-parchment flex flex-col z-40">
      <div className="border-b border-line px-4 py-3 flex items-center gap-3 bg-parchment">
        <GhostButton onClick={onBack}>← Back</GhostButton>
        <div className="min-w-0 flex-1">
          <div className="font-display text-lg truncate">{item.title}</div>
          {item.description && <div className="text-muted text-xs truncate">{item.description}</div>}
        </div>
        <div className="flex items-center gap-2">
          <GhostButton onClick={addColumn}>+ Column</GhostButton>
          <GhostButton onClick={addRow}>+ Row</GhostButton>
        </div>
      </div>
      <div className="flex-1 overflow-auto">
        <table className="min-w-full border-separate border-spacing-0">
          <thead className="sticky top-0 z-10">
            <tr>
              <th className="w-10 bg-parchment border-b border-line" />
              {data.columns.map((col, c) => (
                <th key={col.id} className="group bg-parchment border-b border-line text-left">
                  <div className="relative px-3 py-2 min-w-[160px]">
                    {editing && editing.type === 'header' && editing.c === c ? (
                      <textarea
                        ref={taRef}
                        value={draft}
                        onChange={(e) => setDraft(e.target.value)}
                        onBlur={commit}
                        onKeyDown={handleKey}
                        className="w-full font-mono text-xs uppercase tracking-wider bg-parchment border border-ember/40 rounded px-1.5 py-1 outline-none"
                        rows={1}
                      />
                    ) : (
                      <button
                        onDoubleClick={() => startHeaderEdit(c)}
                        className="font-mono text-xs uppercase tracking-wider text-muted hover:text-ink text-left w-full"
                        title="Double-click to rename"
                      >
                        {col.label || '—'}
                      </button>
                    )}
                    <button
                      onClick={() => deleteColumn(c)}
                      className="absolute right-1 top-1 opacity-0 group-hover:opacity-100 text-muted hover:text-ember text-xs px-1.5 py-0.5 rounded transition-opacity"
                      title="Delete column"
                    >×</button>
                  </div>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {data.rows.map((row, r) => (
              <tr key={r} className="group">
                <td className="w-10 border-b border-line/60 align-top">
                  <div className="relative h-full">
                    <span className="block font-mono text-[10px] text-muted/60 text-right pr-2 pt-3">{r + 1}</span>
                  </div>
                </td>
                {data.columns.map((col, c) => (
                  <td key={col.id} className="border-b border-line/60 align-top">
                    {editing && editing.type === 'cell' && editing.r === r && editing.c === c ? (
                      <textarea
                        ref={taRef}
                        value={draft}
                        onChange={(e) => setDraft(e.target.value)}
                        onBlur={commit}
                        onKeyDown={handleKey}
                        className="w-full min-h-[44px] px-3 py-2 text-sm bg-parchment border border-ember/40 outline-none"
                        rows={Math.max(1, draft.split('\n').length)}
                      />
                    ) : (
                      <button
                        onClick={() => startCellEdit(r, c)}
                        className="w-full text-left px-3 py-2 text-sm text-ink hover:bg-line/40 whitespace-pre-wrap min-h-[44px]"
                      >
                        {row[c] || <span className="text-muted/50">—</span>}
                      </button>
                    )}
                  </td>
                ))}
                <td className="w-10 border-b border-line/60 align-top">
                  <button
                    onClick={() => deleteRow(r)}
                    className="opacity-0 group-hover:opacity-100 text-muted hover:text-ember text-xs px-2 py-2 transition-opacity"
                    title="Delete row"
                  >×</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        {(!data.rows.length || !data.columns.length) && (
          <div className="p-8 text-center text-muted text-sm">
            {!data.columns.length && <p>Add a column to begin.</p>}
            {data.columns.length > 0 && !data.rows.length && <p>Add a row to begin entering data.</p>}
          </div>
        )}
      </div>
    </div>
  );
}

// ───────────────────────────────────────────────────────────────────────────
// Admin portal
// ───────────────────────────────────────────────────────────────────────────
function AdminPortal({ archive, onClose }) {
  const { config, setConfig, items, upsertItem, deleteItem, addTab, deleteTab } = archive;
  const [pageTitle, setPageTitle] = useState(config.pageTitle);
  const [newTabName, setNewTabName] = useState('');
  const fileInputRef = useRef(null);
  const [dragOver, setDragOver] = useState(false);

  useEffect(() => { setPageTitle(config.pageTitle); }, [config.pageTitle]);

  const commitTitle = () => {
    const next = (pageTitle || '').trim() || 'Archive';
    if (next !== config.pageTitle) setConfig({ ...config, pageTitle: next });
  };

  const handleFiles = async (files) => {
    const list = Array.from(files || []);
    for (const f of list) {
      const isHtml = /\.html?$/i.test(f.name) || f.type.includes('html');
      if (!isHtml) continue;
      const text = await f.text();
      const item = {
        id: uid('item'),
        type: 'html',
        title: f.name.replace(/\.html?$/i, ''),
        description: '',
        tabId: 'all',
        createdAt: Date.now(),
        data: { content: text, size: text.length },
      };
      upsertItem(item);
    }
  };

  const onDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    handleFiles(e.dataTransfer.files);
  };

  const createBlankTable = () => {
    const item = {
      id: uid('item'),
      type: 'table',
      title: 'Untitled table',
      description: '',
      tabId: 'all',
      createdAt: Date.now(),
      data: {
        columns: [
          { id: uid('c'), label: 'Column 1' },
          { id: uid('c'), label: 'Column 2' },
        ],
        rows: [['', ''], ['', '']],
      },
    };
    upsertItem(item);
  };

  return (
    <div className="fixed inset-0 bg-parchment z-50 fade-in overflow-y-auto">
      <div className="max-w-3xl mx-auto px-6 py-8">
        <div className="flex items-center justify-between mb-8">
          <div>
            <p className="font-mono text-[10px] uppercase tracking-wider text-muted">Admin</p>
            <h2 className="font-display text-3xl text-ink mt-1">Settings</h2>
          </div>
          <GhostButton onClick={onClose}>Done</GhostButton>
        </div>

        {/* Page title */}
        <section className="mb-10">
          <h3 className="font-mono text-[10px] uppercase tracking-wider text-muted mb-2">Page title</h3>
          <input
            value={pageTitle}
            onChange={(e) => setPageTitle(e.target.value)}
            onBlur={commitTitle}
            onKeyDown={(e) => { if (e.key === 'Enter') { e.currentTarget.blur(); } }}
            className="w-full font-display text-2xl bg-transparent border-b border-line focus:border-ember outline-none py-2 text-ink"
          />
        </section>

        {/* Tabs */}
        <section className="mb-10">
          <h3 className="font-mono text-[10px] uppercase tracking-wider text-muted mb-3">Tabs</h3>
          {!config.tabs.length && <p className="text-sm text-muted mb-3">No custom tabs yet. Items will appear under "All".</p>}
          <ul className="space-y-2 mb-4">
            {config.tabs.map((t) => {
              const count = items.filter((i) => i.tabId === t.id).length;
              return (
                <li key={t.id} className="flex items-center justify-between border border-line rounded-md px-3 py-2">
                  <div className="flex items-baseline gap-3">
                    <span className="text-ink">{t.name}</span>
                    <span className="font-mono text-[10px] text-muted">{count} items</span>
                  </div>
                  <button onClick={() => deleteTab(t.id)} className="text-xs text-muted hover:text-ember">Delete</button>
                </li>
              );
            })}
          </ul>
          <div className="flex gap-2">
            <input
              value={newTabName}
              onChange={(e) => setNewTabName(e.target.value)}
              placeholder="New tab name"
              onKeyDown={(e) => {
                if (e.key === 'Enter' && newTabName.trim()) {
                  addTab(newTabName.trim());
                  setNewTabName('');
                }
              }}
              className="flex-1 border border-line rounded-md px-3 py-2 text-sm bg-parchment outline-none focus:border-ember"
            />
            <GhostButton onClick={() => {
              if (newTabName.trim()) { addTab(newTabName.trim()); setNewTabName(''); }
            }}>Add tab</GhostButton>
          </div>
        </section>

        {/* Upload HTML / New table */}
        <section className="mb-10">
          <h3 className="font-mono text-[10px] uppercase tracking-wider text-muted mb-3">Add content</h3>
          <div
            onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={onDrop}
            className={`border-2 border-dashed rounded-lg p-6 text-center transition-colors ${dragOver ? 'border-ember bg-ember/5' : 'border-line bg-parchment'}`}
          >
            <p className="text-sm text-ink">Drop HTML files here</p>
            <p className="text-xs text-muted mt-1">or</p>
            <div className="mt-3 flex items-center justify-center gap-2">
              <GhostButton onClick={() => fileInputRef.current?.click()}>Choose files</GhostButton>
              <PrimaryButton onClick={createBlankTable}>New table</PrimaryButton>
            </div>
            <input ref={fileInputRef} type="file" multiple accept=".html,.htm,text/html" className="hidden"
              onChange={(e) => handleFiles(e.target.files)} />
          </div>
        </section>

        {/* Items list with edit */}
        <section>
          <h3 className="font-mono text-[10px] uppercase tracking-wider text-muted mb-3">Items ({items.length})</h3>
          {!items.length && <p className="text-sm text-muted">No items yet.</p>}
          <ul className="space-y-3">
            {items.map((it) => (
              <AdminItemRow key={it.id} item={it} tabs={config.tabs}
                onChange={(next) => upsertItem(next)}
                onDelete={() => deleteItem(it.id)} />
            ))}
          </ul>
        </section>

        <div className="mt-12 text-center font-mono text-[10px] text-muted">
          {SUPABASE_ENABLED ? 'Supabase sync: ON' : 'Local-only mode · configure SUPABASE_URL/KEY in source to enable sync'}
        </div>
      </div>
    </div>
  );
}

function AdminItemRow({ item, tabs, onChange, onDelete }) {
  const [title, setTitle] = useState(item.title);
  const [desc, setDesc] = useState(item.description || '');
  const [tabId, setTabId] = useState(item.tabId || 'all');

  useEffect(() => { setTitle(item.title); setDesc(item.description || ''); setTabId(item.tabId || 'all'); }, [item.id]);

  const persist = (patch) => {
    onChange({ ...item, title, description: desc, tabId, ...patch });
  };

  return (
    <li className="border border-line rounded-md p-3">
      <div className="flex items-start gap-3">
        <span className="font-mono text-[10px] uppercase tracking-wider text-muted/80 mt-2 w-12 shrink-0">{item.type}</span>
        <div className="flex-1 min-w-0 space-y-2">
          <input
            value={title}
            onChange={(e) => setTitle(e.target.value)}
            onBlur={() => persist({ title })}
            placeholder="Title"
            className="w-full font-display text-lg bg-transparent border-b border-line focus:border-ember outline-none py-1"
          />
          <input
            value={desc}
            onChange={(e) => setDesc(e.target.value)}
            onBlur={() => persist({ description: desc })}
            placeholder="Description"
            className="w-full text-sm bg-transparent border-b border-line focus:border-ember outline-none py-1 text-muted"
          />
          <div className="flex items-center gap-3 text-xs">
            <label className="font-mono text-[10px] uppercase tracking-wider text-muted">Tab</label>
            <select
              value={tabId}
              onChange={(e) => { setTabId(e.target.value); persist({ tabId: e.target.value }); }}
              className="border border-line rounded-md px-2 py-1 bg-parchment text-sm outline-none focus:border-ember"
            >
              <option value="all">All</option>
              {tabs.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
        </div>
        <button onClick={() => {
          if (confirm(`Delete "${item.title}"?`)) onDelete();
        }} className="text-xs text-muted hover:text-ember shrink-0">Delete</button>
      </div>
    </li>
  );
}

// ───────────────────────────────────────────────────────────────────────────
// Root app
// ───────────────────────────────────────────────────────────────────────────
function App() {
  const archive = useArchive();
  const [view, setView] = useState({ mode: 'list', itemId: null });
  const [adminOpen, setAdminOpen] = useState(false);
  const [currentTab, setCurrentTab] = useState('all');

  const filtered = useMemo(() => {
    if (currentTab === 'all') return archive.items;
    return archive.items.filter((i) => i.tabId === currentTab);
  }, [archive.items, currentTab]);

  const counts = useMemo(() => {
    const c = { all: archive.items.length };
    archive.config.tabs.forEach((t) => { c[t.id] = 0; });
    archive.items.forEach((it) => {
      if (c[it.tabId] !== undefined) c[it.tabId] += 1;
    });
    return c;
  }, [archive.items, archive.config.tabs]);

  const openItem = (item) => setView({ mode: item.type, itemId: item.id });
  const back = () => setView({ mode: 'list', itemId: null });

  const activeItem = view.itemId ? archive.items.find((i) => i.id === view.itemId) : null;

  // Show list view (header + tabs + items)
  return (
    <div className="min-h-full">
      <Header title={archive.config.pageTitle} onOpenAdmin={() => setAdminOpen(true)} />
      {archive.config.tabs.length >= 1 && (
        <TabBar tabs={archive.config.tabs} current={currentTab} onChange={setCurrentTab} counts={counts} />
      )}
      <ItemList items={filtered} onOpen={openItem} />

      {/* Item full-screen viewers */}
      {activeItem && activeItem.type === 'html' && (
        <HtmlViewer item={activeItem} onBack={back} />
      )}
      {activeItem && activeItem.type === 'table' && (
        <TableEditor item={activeItem} onBack={back} onSave={archive.upsertItem} />
      )}

      {/* Admin overlay */}
      {adminOpen && (
        <AdminPortal archive={archive} onClose={() => setAdminOpen(false)} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
